name: pos_app
description: برنامج مساعد ذكاء اصطناعي محلي أوفلاين (Windows) يعمل على الجوال وسطه المكتب (POS) نظام نقاط بيع
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # -------- قاعدة البيانات والتقارير (موجودة سابقاً في المشروع) --------
  sqflite: ^2.3.3
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.13.2

  # =================================================================
  # -------- دعم سطح المكتب (Windows/Linux/macOS) --------
  # =================================================================
  # sqflite الأصلية تعمل فقط على قنوات مدمجة أندرويد و iOS،
  # لنفس واجهة (FFI) تعمل على ويندوز. هذه الحزمة توفر تطبيقا بديلا بـ
  # موجود CRUD يعمل على ويندوز/لينكس/ماك دون تغيير أي كود sqflite
  # (راجع database_helper.dart -> _initDesktopSqliteIfNeeded).
  sqflite_common_ffi: ^2.4.0
  # المدمجة مع build_hooks حتى يعمل بند sqlite3 لأسماء صريحة حتى
  # تلقائياً sqlite3.dll التي للمحاذي 2.4.0
  # .عند البناء لويندوز (لا حاجة لترداد الملف يدوياً).
  sqlite3: ^3.0.0

  # =================================================================
  # -------- الطباعة على طابعات الفواتير الحرارية في ويندوز --------
  # =================================================================
  # على WinSpool خام مباشرة لطباعة الإيميلات عبر ESC/POS كأرسال أوامر
  # ("Generic/Text Only" تطبيقات PDF بدل أدنى من طباعة).
  # راجع receipt_service.dart -> printReceiptRawOnWindows().
  windows_printer: ^0.2.0

  # =================================================================
  # -------- مكتبات الذكاء الاصطناعي المحلي (On-Device LLM) --------
  # =================================================================
  # لا تحمل أي محرك تشغيل بمفردها - (Core) حزمة الأساسية #
  # flutter_gemma: ^1.6.5

  # الويب/iOS/محلياً على أندرويد task. لتشغيل ملفات MediaPipe #
  # flutter_gemma_mediapipe: ^1.6.5

  # المطلوب لتشغيل النموذج على سطح المكتب (وبنود LiteRT-LM) #
  # على سطح MediaPipe لا يوجد محرك .literlm) محلياً). #
  # المكتب إطلاقاً لذا هذه الحزمة الإلزامية لعمل المساعد الذكي على #
  # (الذي يختارها تلقائياً حسب المنصة راجع ai_service.dart) ويندوز #
  # flutter_gemma_litertlm: ^1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # اختياري: فعل هذا القسم فقط إذا قررت تضمين النموذج كملف داخل #
  # بدل تحميله من الإنترنت، بحيث يعمل التطبيق نفسه (Bundled Asset) #
  # المساعد أوفلاين 100% من أول تشغيل بدون أي تنزيل #
  # assets:
  #   - assets/models/gemma3-270m-it.litertlm
