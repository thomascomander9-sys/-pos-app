name: pos_app
description: نظام نقاط بيع (POS) بلغة Flutter — يعمل على الجوال وسطح المكتب (Windows) مع مساعد ذكاء اصطناعي محلي أوفلاين.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # -------- قاعدة البيانات والتقارير (موجودة مسبقاً في المشروع) --------
  sqflite: ^2.3.3
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.13.2

  # ================================================================
  # -------- ✅ دعم سطح المكتب (Windows/Linux/macOS) لقاعدة البيانات --------
  # ================================================================
  # حزمة sqflite الأصلية تعمل فقط عبر قنوات منصّة أندرويد/iOS، ولا
  # تعمل على ويندوز. هذه الحزمة توفّر تطبيقاً بديلاً (FFI) لنفس واجهة
  # sqflite يعمل على ويندوز/لينكس/ماك دون تغيير أي كود CRUD موجود
  # (راجع database_helper.dart -> _initDesktopSqfliteIfNeeded).
  sqflite_common_ffi: ^2.4.0
  # اعتماد صريح على sqlite3 v3 حتى يعمل آلية build_hooks المدمجة في
  # sqflite_common_ffi ^2.4.0 التي تُحمّل/تبني sqlite3.dll تلقائياً
  # عند البناء لويندوز (لا حاجة لإرفاق الملف يدوياً).
  sqlite3: ^3.0.0

  # ================================================================
  # -------- ✅ الطباعة على طابعات الفواتير الحرارية في ويندوز --------
  # ================================================================
  # لإرسال أوامر ESC/POS خام مباشرة لطابعة الإيصالات عبر WinSpool على
  # ويندوز (بديل أدق من طباعة PDF لطابعات "Generic/Text Only").
  # راجع receipt_service.dart -> printReceiptRawOnWindows().
  windows_printer: ^0.2.0

  # ================================================================
  # -------- مكتبات الذكاء الاصطناعي المحلي (On-Device LLM) --------
  # ================================================================
  # الحزمة الأساسية (Core) — لا تحمّل أي محرك تشغيل بمفردها
  flutter_gemma: ^1.6.5

  # محرك MediaPipe لتشغيل ملفات .task محلياً على أندرويد/iOS/الويب
  flutter_gemma_mediapipe: ^1.6.5

  # ✅ محرك LiteRT-LM المطلوب لتشغيل النموذج على سطح المكتب (ويندوز/
  # ماك/لينكس) بصيغة .litertlm — لا يوجد محرك MediaPipe على سطح
  # المكتب إطلاقاً، لذا هذه الحزمة إلزامية لعمل المساعد الذكي على
  # ويندوز (راجع ai_service.dart الذي يختارها تلقائياً حسب المنصة).
  flutter_gemma_litertlm: ^1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # اختياري: فعّل هذا القسم فقط إذا قررت تضمين نموذج مصغّر داخل
  # التطبيق نفسه (Bundled Asset) بدل تحميله من الإنترنت، بحيث يعمل
  # المساعد أوفلاين 100% من أول تشغيل بدون أي تنزيل.
  # assets:
  #   - assets/models/gemma3-270m-it.litertlm
